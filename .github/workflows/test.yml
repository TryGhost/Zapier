name: Test
on:
  pull_request:
  push:
    branches:
      - main
  # the publish workflow dispatches Test onto its release bookkeeping
  # branch: PRs created with GITHUB_TOKEN never trigger pull_request runs,
  # and the 'Required checks pass' rule needs a run on the head commit
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [ '22', '24' ]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      # Zapier runs the app on AWS Lambda's Node 22 runtime, which starts Node
      # with these flags and so turns off defaults newer Node has on, such as
      # require() of an ES module. Building checks the packaged app loads, so with
      # the same flags code that only loads with those defaults fails here
      # rather than on Zapier.
      # https://docs.aws.amazon.com/lambda/latest/dg/lambda-nodejs.html
      - name: Check the packaged app loads on Zapier's runtime
        if: matrix.node == '22'
        run: pnpm exec zapier-platform build --skip-dep-install
        env:
          NODE_OPTIONS: --no-experimental-require-module --no-experimental-detect-module

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: E2E (real Ghost)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TryGhost/Ghost
          ref: main
          path: Ghost
          # the default theme lives in a submodule and Ghost needs it to boot
          submodules: true
          persist-credentials: false
      # Node version follows Ghost's engines (^22.18.0); the Zapier app
      # itself is tested on its full matrix in the build job
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      # corepack picks the pinned pnpm per directory: this app's
      # packageManager field at the root, Ghost's own inside Ghost/
      - name: Install Corepack
        run: npm install --global corepack@0.34.6
      - name: Enable corepack
        run: corepack enable
      - name: Get pnpm store directory
        id: pnpm-store
        # each pnpm major keeps its store in a versioned subdirectory
        # (e.g. v10 for this app, v11 for Ghost), so cache the common parent
        run: echo "path=$(dirname "$(pnpm store path --silent)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'Ghost/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install Ghost dependencies
        working-directory: Ghost
        run: pnpm install --frozen-lockfile --filter ghost...
      - run: pnpm install --frozen-lockfile
      - name: Start Ghost from source
        run: ./test-e2e/setup/start-ghost.sh
        env:
          GHOST_CORE_PATH: ${{ github.workspace }}/Ghost
          GHOST_LOG_FILE: ${{ runner.temp }}/ghost-boot.log
      - name: Bootstrap Ghost owner and integration
        run: node test-e2e/setup/bootstrap.js
      - run: pnpm test:e2e
      - name: Dump Ghost logs
        if: failure()
        run: cat "${{ runner.temp }}/ghost-boot.log"

  required-checks-pass:
    name: Required checks pass
    if: always()
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
